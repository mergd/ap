version = 1
scope = "global"

# Generated by: ap init --global
# Secret values live here as value = "..." (there is no global secrets.json).
# Bundle identity (which keys, ask/docs/prompt) comes from the built-in catalog —
# this file only stores var stubs + values. Re-run ap init --global [BUNDLE...] to
# merge new catalog vars without overwriting yours.

[var.CF_GLOBAL_API_KEY]
visibility = "secret"
ask = "My Profile → API Tokens → Global API Key."

[var.CF_GLOBAL_EMAIL]
visibility = "public"
ask = "Account login email."

[var.NC_API_USER]
visibility = "public"
ask = "API username (usually your account username)."

[var.NC_API_KEY]
visibility = "secret"
ask = "Profile → Tools → API Access."

[var.NC_CLIENT_IP]
visibility = "public"
ask = "Whitelisted client IP (resolved at runtime)."
derive = "public-ipv4"

[var.OPENROUTER_MANAGEMENT_API_KEY]
visibility = "secret"
ask = "OpenRouter Settings → Management API Keys. Cannot call completions."

[var.OPENROUTER_API_KEY]
visibility = "secret"
ask = "OpenRouter usage API key (or provision via management key)."
